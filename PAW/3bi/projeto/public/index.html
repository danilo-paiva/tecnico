<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Eventos — PAW 3º Bimestre</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-wrap">
    <div class="card login-card" style="text-align:center">
      <h2>🎟️ Gestão de Eventos</h2>
      <p class="muted">Projeto do 3º bimestre de PAW — API REST (Slim + JWT) com frontend HTML/JavaScript.</p>
      <div class="acoes" style="justify-content:center">
        <a class="btn btn-primario" href="login.html">Entrar</a>
        <a class="btn btn-neutro" href="dashboard.html">Painel</a>
      </div>
    </div>
  </div>
  <script>
    // Quem já tem token vai direto ao painel; quem não tem, ao login.
    document.addEventListener("DOMContentLoaded", () => {
      window.location.href = localStorage.getItem("token") ? "dashboard.html" : "login.html";
    });
  </script>
</body>
</html>
