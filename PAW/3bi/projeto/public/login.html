<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Gestão de Eventos</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Ficha item 1: interface visual de login funcional (HTML/JS + REST + JWT) -->
  <div class="login-wrap">
    <div class="card login-card">
      <h2>🔐 Entrar</h2>
      <p class="muted">Faça login para receber o token JWT e acessar os recursos da API.</p>

      <div id="msg" class="msg"></div>

      <form id="formLogin">
        <label for="txtEmail">E-mail</label>
        <input id="txtEmail" type="email" placeholder="ana@email.com" required autocomplete="username">

        <label for="txtSenha">Senha</label>
        <input id="txtSenha" type="password" placeholder="••••••" required autocomplete="current-password">

        <div class="acoes">
          <button type="submit" class="btn-primario" id="btnEntrar">Entrar</button>
        </div>
      </form>

      <p class="muted">Usuário de exemplo (seed do banco):<br>
        <strong>ana@email.com</strong> / <strong>123456</strong>
      </p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script type="module">
    import ApiService from "./js/ApiService.js";
    import { salvarSessao, mostrarMsg } from "./js/auth.js";

    // Se já está logado, pula o login.
    if (localStorage.getItem("token")) window.location.href = "dashboard.html";

    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("formLogin");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const email = document.getElementById("txtEmail").value.trim();
        const senha = document.getElementById("txtSenha").value;
        if (!email || !senha) { mostrarMsg("Informe e-mail e senha.", "erro"); return; }

        mostrarMsg("Entrando...", "info");
        const api = new ApiService(); // login é público: sem token
        const resposta = await api.post(`${API_BASE_URL}/login`, { participante: { email, senha } });

        if (resposta && resposta.success) {
          salvarSessao(resposta.data.token, resposta.data.participante);
          mostrarMsg("Login realizado com sucesso!", "ok");
          window.location.href = "dashboard.html";
        } else {
          mostrarMsg((resposta && resposta.message) || "Não foi possível entrar.", "erro");
        }
      });
    });
  </script>
</body>
</html>
