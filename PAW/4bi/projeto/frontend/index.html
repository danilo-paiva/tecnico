<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <title>Visão geral · Pulse Eventos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="dashboard">
    <div id="app"></div>

    <template id="conteudo">
        <div class="page-head">
            <div>
                <h2 id="saudacao">Olá!</h2>
                <p>Resumo dos seus eventos, lotes e equipe.</p>
            </div>
            <div class="actions">
                <a class="btn" href="organizadores.html">Organizadores</a>
                <a class="btn btn-accent" href="eventos.html?novo=1">+ Novo evento</a>
            </div>
        </div>

        <div class="grid grid-3">
            <article class="card stat">
                <div class="stat-top">
                    <span class="stat-label">Eventos</span>
                    <span class="stat-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
                    </span>
                </div>
                <div class="stat-value" id="statEventos">—</div>
                <div class="stat-foot" id="statEventosFoot">carregando…</div>
            </article>

            <article class="card stat">
                <div class="stat-top">
                    <span class="stat-label">Lotes cadastrados</span>
                    <span class="stat-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v1a2 2 0 0 0 0 4v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1a2 2 0 0 0 0-4z"/></svg>
                    </span>
                </div>
                <div class="stat-value" id="statLotes">—</div>
                <div class="stat-foot" id="statLotesFoot">carregando…</div>
            </article>

            <article class="card stat">
                <div class="stat-top">
                    <span class="stat-label">Ingressos disponíveis</span>
                    <span class="stat-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><path d="M16 5.2A3 3 0 0 1 16 11"/></svg>
                    </span>
                </div>
                <div class="stat-value" id="statDisponiveis">—</div>
                <div class="stat-foot" id="statDisponiveisFoot">carregando…</div>
            </article>
        </div>

        <div class="dash-split">
            <section class="card">
                <div class="card-head">
                    <h3>Próximos eventos</h3>
                    <a class="btn btn-sm" href="eventos.html">Ver todos</a>
                </div>
                <div class="upcoming" id="proximos"></div>
            </section>

            <div class="grid">
                <section class="card">
                    <div class="card-head">
                        <h3>Disponibilidade</h3>
                        <small>lotes com menor saldo</small>
                    </div>
                    <div class="card-body" id="disponibilidade" style="display:grid;gap:14px"></div>
                </section>

                <section class="card">
                    <div class="card-head"><h3>Atalhos</h3></div>
                    <div class="card-body quick">
                        <a href="eventos.html?novo=1">
                            <span class="qicon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></span>
                            <span><b>Cadastrar evento</b><small>Título, data e organizador</small></span>
                        </a>
                        <a href="lotes.html?novo=1">
                            <span class="qicon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></span>
                            <span><b>Cadastrar lote</b><small>Preço e quantidade</small></span>
                        </a>
                        <a href="organizadores.html">
                            <span class="qicon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg></span>
                            <span><b>Gerenciar equipe</b><small>Perfis e acessos</small></span>
                        </a>
                    </div>
                </section>
            </div>
        </div>

        <p class="footer-note">
            Conectado em <code id="rodapeApi">—</code>. O token JWT é o mesmo nas APIs Node e Flask.
        </p>
    </template>

    <script src="js/ApiService.js"></script>
    <script src="js/sessao.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/paginas/dashboard.js"></script>
</body>
</html>
